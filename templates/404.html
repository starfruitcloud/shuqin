<!doctype html>
<html lang="zh">

{{ template "header" . }}
<body>
<!-- ***** Preloader Start ***** -->
<div id="js-preloader" class="js-preloader">
   <div class="preloader-inner">
      <span class="dot"></span>
      <div class="dots">
         <span></span>
         <span></span>
         <span></span>
      </div>
   </div>
</div>
<!-- ***** Preloader End ***** -->

<!-----------------Start-404-error-page----------------->

<section class="error" id="page-error">
   <div class="container">
      <div class="page-img text-center">
         <img src="https://cdn.shuqin.cc/shuqin/static/img/404.jpg" alt="">
      </div>
      <div class="col-12">
         <div class="error-content text-center">
            <h2>页面未找到</h2>
            <p class="mt-3">您访问的页面可能已被删除、更名，或暂时不可用。抱歉带来不便。如有疑问，请与我们联系。</p>
            <div class="default-btn-one btn-lg btn-info text-center">
               <a href="/">返回首页</a>
            </div>
         </div>
      </div>
   </div>
</section>

<!-----------------End-404-error-page----------------->
{{ template "footer" . }}
</body>
</html>
